<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #0F1923; color: #F5F2EC; font-family: 'Barlow', sans-serif; -webkit-font-smoothing: antialiased; }

  main { padding: clamp(90px,14vw,160px) 0; text-align: center; }
  .eyebrow { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: #B8946A; }
  h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: clamp(32px,4.4vw,58px); line-height: .98; text-transform: uppercase; margin: 18px 0 0; }
  p { font-weight: 300; font-size: 16px; line-height: 1.7; color: rgba(245,242,236,.6); max-width: 46ch; margin: 20px auto 0; }
  .back { display: inline-block; margin-top: clamp(40px,6vw,64px); font-family: 'DM Mono', monospace; font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; }
  footer { border-top: 1px solid rgba(184,148,106,.16); padding: 28px 0; font-family: 'DM Mono', monospace; font-size: 9.5px; letter-spacing: .16em; color: rgba(245,242,236,.32); }
</style>
</head>
<body>
  <header><div class="wrap inner">
